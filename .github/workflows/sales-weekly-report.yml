name: Sales weekly report cron

# Calls POST /api/cron/sales-weekly-report every Thursday at 23:59 Nairobi time
# (20:59 UTC). It emails the CEO the sales team's activity for the Friday–Thursday
# week that is ending. (GitHub may start scheduled runs a few minutes late; the
# report week is chosen so a late start still reports the right week.) Uses the same secrets as the other cron workflows:
#   CRON_SECRET, API_BASE_URL  (Repo Settings → Secrets and variables → Actions)
# Copy this file to .github/workflows/ to enable it.

on:
  schedule:
    - cron: "59 20 * * 4" # Thursdays 20:59 UTC = 23:59 EAT
  workflow_dispatch: {}

jobs:
  sales-weekly-report:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sales-weekly-report
        run: |
          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${API_BASE_URL}/api/cron/sales-weekly-report" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP status: $http_status"
          cat /tmp/response.json
          echo ""
          if [ "$http_status" -ge 400 ]; then
            echo "::error::Sales weekly report cron call failed with status $http_status"
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}