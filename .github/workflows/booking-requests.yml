name: Booking requests cron

# Calls POST /api/cron/booking-requests so booking requests that need the
# host's approval are handled on time:
#   - a reminder goes to the host when a request has been waiting a while
#   - a request nobody answered in time is closed, and the client is told
#
# Uses the same secrets as the other cron workflows:
#   CRON_SECRET, API_BASE_URL  (Repo Settings → Secrets and variables → Actions)
#
# GitHub's scheduled workflows have a 5-minute floor and can run a few
# minutes late under load. That only delays the emails: the booking page
# frees an expired request's time slot by itself, on the dot.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {}

jobs:
  booking-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/booking-requests
        run: |
          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${API_BASE_URL}/api/cron/booking-requests" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $http_status"
          cat /tmp/response.json
          echo ""

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Booking request cron call failed with status $http_status"
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}