name: Task reminders cron

# Calls POST /api/cron/task-reminders so personal task reminders are delivered
# when their time arrives. Uses the same secrets as the email-sync workflow:
#   CRON_SECRET, API_BASE_URL  (Repo Settings → Secrets and variables → Actions)
#
# GitHub's scheduled workflows have a 5-minute floor and can run a few minutes
# late under load, so a reminder may arrive up to ~10 minutes after its time.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {}

jobs:
  task-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/task-reminders
        run: |
          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "${API_BASE_URL}/api/cron/task-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")

          echo "HTTP status: $http_status"
          cat /tmp/response.json
          echo ""

          if [ "$http_status" -ge 400 ]; then
            echo "::error::Task reminder cron call failed with status $http_status"
            exit 1
          fi
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}